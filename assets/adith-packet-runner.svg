<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">Adith — Packet Runner</title>
  <desc id="description">An original looping arcade animation: Adith's spacecraft collects code packets, dodges bugs, and completes a build. Decorative autoplay, with no interactive controls.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#141421"/><stop offset="1" stop-color="#090c14"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#de3543" stop-opacity="0"/><stop offset="1" stop-color="#de3543" stop-opacity=".15"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a7b5ce" stroke-opacity=".055"/></pattern>
    <clipPath id="field"><rect x="25" y="92" width="910" height="262" rx="12"/></clipPath>
    <g id="packet"><rect x="-27" y="-17" width="54" height="34" rx="9" fill="#102c31" stroke="#5ce4ce"/><path d="m-10-5-6 5 6 5m20-10 6 5-6 5m-7-12-6 14" fill="none" stroke="#8effe8" stroke-width="2" stroke-linecap="round"/></g>
    <g id="bug" fill="#ff6974"><path d="M-12-8H12V9H-12zM-6-13H6V-8H-6zM-18-5H-12V-1H-18zM12-5H18V-1H12zM-18 5H-12V9H-18zM12 5H18V9H12zM-8 9H-4V15H-8zM4 9H8V15H4z"/><path d="M-6-3H-2V1H-6zM2-3H6V1H2z" fill="#15131d"/></g>
    <g id="spark" fill="none" stroke="#5ce4ce" stroke-width="2"><circle r="25"/><path d="M0-36V-29M0 29V36M-36 0H-29M29 0H36M-25-25-20-20M20 20 25 25M25-25 20-20M-20 20-25 25"/></g>
  </defs>
  <rect x="1" y="1" width="958" height="418" rx="22" fill="url(#bg)" stroke="#34303f"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <rect x="26" y="25" width="5" height="43" rx="2" fill="#de3543"/>
    <text x="45" y="43" fill="#ff6974" font-size="11" letter-spacing="3">ADITH'S ARCADE / 01</text>
    <text x="43" y="68" fill="#f2f4fa" font-size="24" font-weight="700" letter-spacing="2">PACKET RUNNER</text>
    <text x="706" y="38" fill="#8590a6" font-size="10" letter-spacing="2">BUILD SCORE</text>
    <g fill="#8effe8" font-size="23" font-weight="700" text-anchor="end">
      <text x="815" y="67">0000<animate attributeName="visibility" values="visible;hidden;hidden" keyTimes="0;.167;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="815" y="67" visibility="hidden">0100<animate attributeName="visibility" values="hidden;visible;hidden;hidden" keyTimes="0;.167;.333;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="815" y="67" visibility="hidden">0200<animate attributeName="visibility" values="hidden;visible;hidden;hidden" keyTimes="0;.333;.5;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="815" y="67" visibility="hidden">0300<animate attributeName="visibility" values="hidden;visible;hidden;hidden" keyTimes="0;.5;.667;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="815" y="67" visibility="hidden">0400<animate attributeName="visibility" values="hidden;visible;hidden;hidden" keyTimes="0;.667;.833;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="815" y="67" visibility="hidden">0500<animate attributeName="visibility" values="hidden;visible;hidden" keyTimes="0;.833;1" dur="12s" repeatCount="indefinite"/></text>
    </g>
    <rect x="844" y="29" width="88" height="35" rx="17" fill="#de3543" fill-opacity=".12" stroke="#de3543" stroke-opacity=".4"/>
    <circle cx="859" cy="46" r="3" fill="#ff6974"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="870" y="50" fill="#ff929a" font-size="10">AUTOPLAY</text>
    <g clip-path="url(#field)">
      <rect x="25" y="92" width="910" height="262" fill="#0b101b"/>
      <rect x="25" y="52" width="910" height="342" fill="url(#grid)"><animateTransform attributeName="transform" type="translate" from="0 0" to="0 40" dur="3s" repeatCount="indefinite"/></rect>
      <path d="M180 92V354M380 92V354M580 92V354M780 92V354" stroke="#a7b5ce" stroke-opacity=".08" stroke-dasharray="3 12"/>
      <rect x="25" y="280" width="910" height="74" fill="url(#floor)"/>
      <g fill="#c4d3ed" opacity=".4"><circle cx="82" cy="130" r="1"/><circle cx="280" cy="200" r="1.5"/><circle cx="460" cy="120" r="1"/><circle cx="680" cy="240" r="1"/><circle cx="866" cy="158" r="1.5"/><circle cx="120" cy="270" r="1"/><animateTransform attributeName="transform" type="translate" values="0 -20;0 60" dur="6s" repeatCount="indefinite"/></g>
      <!-- Each packet meets the ship on the same twelve-second timeline. -->
      <g><animateTransform attributeName="transform" type="translate" values="180 65;180 292;180 292" keyTimes="0;.167;1" dur="12s" repeatCount="indefinite"/><use href="#packet"/><animate attributeName="opacity" values="1;0;0" keyTimes="0;.167;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g>
      <g><animateTransform attributeName="transform" type="translate" values="380 65;380 65;380 292;380 292" keyTimes="0;.167;.333;1" dur="12s" repeatCount="indefinite"/><use href="#packet"/><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.167;.333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g>
      <g><animateTransform attributeName="transform" type="translate" values="580 65;580 65;580 292;580 292" keyTimes="0;.333;.5;1" dur="12s" repeatCount="indefinite"/><use href="#packet"/><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.333;.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g>
      <g><animateTransform attributeName="transform" type="translate" values="780 65;780 65;780 292;780 292" keyTimes="0;.5;.667;1" dur="12s" repeatCount="indefinite"/><use href="#packet"/><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.5;.667;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g>
      <g><animateTransform attributeName="transform" type="translate" values="380 65;380 65;380 292;380 292" keyTimes="0;.667;.833;1" dur="12s" repeatCount="indefinite"/><use href="#packet"/><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.667;.833;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g>
      <g><animateTransform attributeName="transform" type="translate" values="780 60;780 400;780 400" keyTimes="0;.45;1" dur="12s" repeatCount="indefinite"/><use href="#bug"/></g>
      <g><animateTransform attributeName="transform" type="translate" values="180 -180;180 400;180 400" keyTimes="0;.8;1" dur="12s" repeatCount="indefinite"/><use href="#bug"/></g>
      <g><animateTransform attributeName="transform" type="translate" values="580 -380;580 400;580 400" keyTimes="0;.94;1" dur="12s" repeatCount="indefinite"/><use href="#bug"/></g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="180 292;180 292;380 292;380 292;580 292;580 292;780 292;780 292;380 292;380 292;180 292" keyTimes="0;.167;.25;.333;.417;.5;.584;.667;.75;.833;1" dur="12s" repeatCount="indefinite"/>
        <ellipse cy="15" rx="46" ry="14" fill="#de3543" opacity=".12"/>
        <path d="M-7 20 0 47 7 20" fill="#ffb56b"><animate attributeName="d" values="M-7 20 0 47 7 20;M-6 20 0 33 6 20;M-7 20 0 47 7 20" dur=".6s" repeatCount="indefinite"/></path>
        <path d="M0-30 11-7 29 13 29 22 8 15 0 21-8 15-29 22-29 13-11-7Z" fill="#de3543" stroke="#ff929a" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M0-18 5-3 0 3-5-3Z" fill="#b9fff2"/>
        <path d="M-15 7-22 15M15 7 22 15" stroke="#ffccd0" stroke-width="2"/>
        <circle r="37" fill="none" stroke="#5ce4ce" stroke-dasharray="4 8" opacity="0"><animate attributeName="opacity" values="0;.8;0;.8;0;.8;0;.8;0;.8;0;0" keyTimes="0;.167;.205;.333;.37;.5;.537;.667;.704;.833;.87;1" dur="12s" repeatCount="indefinite"/></circle>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.85;.88;.96;1" dur="12s" repeatCount="indefinite"/>
        <rect x="300" y="164" width="360" height="80" rx="14" fill="#0d1923" stroke="#5ce4ce" stroke-opacity=".5"/>
        <text x="480" y="197" text-anchor="middle" fill="#8effe8" font-size="19" font-weight="700" letter-spacing="3">BUILD COMPLETE</text>
        <text x="480" y="222" text-anchor="middle" fill="#9baac0" font-size="11">5 PACKETS COLLECTED / 0 BUGS SHIPPED</text>
      </g>
    </g>
    <rect x="25" y="92" width="910" height="262" rx="12" fill="none" stroke="#262d3f"/>
    <g transform="translate(41 385)"><use href="#packet" transform="scale(.4)"/><text x="22" y="4" fill="#a7b5ce" font-size="10" letter-spacing="1">COLLECT CODE</text></g>
    <g transform="translate(233 385)"><use href="#bug" transform="scale(.65)"/><text x="22" y="4" fill="#a7b5ce" font-size="10" letter-spacing="1">DODGE BUGS</text></g>
    <text x="918" y="389" text-anchor="end" fill="#748098" font-size="10" letter-spacing="1">PLAYER: ADITH25 / LOOP: 12s</text>
  </g>
</svg>
